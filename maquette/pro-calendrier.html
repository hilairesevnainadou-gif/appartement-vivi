<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Calendrier · Espace propriétaire · Appartement VIVI</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0a3d3e">
  <link rel="icon" href="assets/img/logo/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="assets/img/logo/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="assets/img/logo/apple-touch-icon.png">
  <link rel="stylesheet" href="assets/vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="assets/vendor/bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="assets/css/vivi.css">
  <link rel="stylesheet" href="assets/css/vivi-pro.css">
</head>
<body class="pro" data-page="calendrier" data-titre="Calendrier">
  <a class="skip-link visually-hidden-focusable" href="#contenu">Aller au contenu</a>
  <div class="pro-shell">
    <aside id="pro-menu" class="pro-side"></aside>
    <div>
      <header id="pro-haut" class="pro-top"></header>
      <main id="contenu" class="pro-main">
        <div class="pro-wrap">

          <div class="pro-head">
            <div>
              <h1>Calendrier</h1>
              <p>Réservations et jours bloqués, logement par logement.</p>
            </div>
            <div style="min-width:min(100%, 280px)">
              <label class="form-label" for="cal-logement">Logement</label>
              <select class="form-select" id="cal-logement"></select>
            </div>
          </div>

          <div class="row g-3">
            <!-- ===== Mois ===== -->
            <div class="col-lg-5">
              <section class="panel" aria-labelledby="cal-mois">
                <div class="cal__head">
                  <h2 id="cal-mois" aria-live="polite"></h2>
                  <div class="cal__nav">
                    <button type="button" id="cal-avant" aria-label="Mois précédent"><i class="bi bi-chevron-left" aria-hidden="true"></i></button>
                    <button type="button" id="cal-apres" aria-label="Mois suivant"><i class="bi bi-chevron-right" aria-hidden="true"></i></button>
                  </div>
                </div>
                <div class="cal__grid" id="cal-grille"></div>
                <ul class="cal__legend" aria-label="Légende">
                  <li><i style="background:var(--vivi-orange-400)"></i>Réservé en partie</li>
                  <li><i style="background:var(--vivi-teal-700)"></i>Complet</li>
                  <li><i style="background:var(--vivi-muted)"></i>Bloqué</li>
                </ul>
              </section>
            </div>

            <!-- ===== Journée choisie ===== -->
            <div class="col-lg-7">
              <section class="panel" aria-labelledby="cal-jour">
                <div class="panel__head">
                  <h2 id="cal-jour" class="premiere-majuscule" aria-live="polite"></h2>
                  <span id="cal-etat"></span>
                </div>
                <ul class="agenda" id="cal-agenda"></ul>
                <div class="mt-3" id="cal-action"></div>
              </section>
            </div>
          </div>

        </div>
      </main>
    </div>
  </div>
  <nav id="pro-nav-basse"></nav>

  <script src="assets/vendor/bootstrap/bootstrap.bundle.min.js"></script>
  <script src="assets/js/vivi-data.js"></script>
  <script src="assets/js/vivi.js"></script>
  <script src="assets/js/vivi-pro.js"></script>
  <script src="assets/js/pages/pro-calendrier.js"></script>
</body>
</html>
