[versions]
agp = "9.3.0"
kotlin = "2.2.10"
coreKtx = "1.16.0"
junit = "4.13.2"
junitVersion = "1.1.5"
espressoCore = "3.5.1"
appcompat = "1.7.0"
material = "1.12.0"
composeBom = "2025.06.00"
activityCompose = "1.10.1"
lifecycle = "2.9.1"
navigation = "2.9.0"
retrofit = "2.11.0"
okhttp = "4.12.0"
serialization = "1.8.1"
coil = "2.7.0"
camerax = "1.4.2"
