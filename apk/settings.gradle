pluginManagement {
    repositories {
        google {
            content {
                includeGroupByRegex("com\\.android.*")
                includeGroupByRegex("com\\.google.*")
                includeGroupByRegex("androidx.*")
            }
        }
        mavenCentral()
        gradlePluginPortal()
    }
}
plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        // Dépôt local facultatif : fichiers téléchargés à part (curl avec reprise) quand la connexion coupe
        def depotLocal = file('.depot-local')
        if (depotLocal.exists()) {
            maven { url = depotLocal.toURI() }
        }
        google()
        mavenCentral()
    }
}

rootProject.name = "Appartement vivi apk"
include ':app'
